# CIFAR-10 Training Configuration
[training]
epochs = 5
batch_size = 32
validation_split = 0.2

[model]
conv_layers = 3
filters = [32, 64, 128]
dense_units = 256
dropout_rate = 0.5

[data]
num_classes = 10
image_size = 32
channels = 3

[paths]
model_save_path = /app/models/
log_path = /app/outputs/logs.csv
